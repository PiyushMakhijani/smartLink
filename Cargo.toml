[package]
name = "smartlink"
version = "0.1.0"
edition = "2021"
autobins = false
description = "Unified cross-platform CLI for symlinks, hardlinks, junctions and bind mounts"
license = "MIT"
authors = ["Piyush"]
readme = "README.md"
homepage = "https://github.com/piyush/smartlink"
repository = "https://github.com/piyush/smartlink"
documentation = "https://github.com/piyush/smartlink#readme"
keywords = ["symlink", "hardlink", "junction", "cli", "filesystem"]
categories = ["command-line-utilities", "filesystem"]
exclude = ["plan.md", "scripts/", ".github/", "packaging/"]

# Project/library is `smartlink`; the CLI is invoked as the shorter `slink`.
[[bin]]
name = "slink"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
colored = "2"
pathdiff = "0.2"
dialoguer = "0.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_SystemServices",
    "Win32_System_Kernel",
    "Win32_Security",
] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["fs", "mount"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
